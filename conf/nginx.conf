daemon off;
user root;
worker_processes 5;
pid /run/nginx.pid;

# Converted to JSON events with "source": "nginx" by log-to-json.awk
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    ##
    # Logging: one JSON access log per request
    ##

    # Requests from the container itself are its healthchecks
    map $remote_addr $loggable {
        127.0.0.1 0;
        ::1 0;
        default 1;
    }

    # $uri becomes /index.php once rewritten by try_files
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }

    # TTFB: $request_time when the response headers are sent to the client,
    # captured by the X-Response-Time header ("0.012" seconds) and converted
    # to milliseconds
    map $sent_http_x_response_time $ttfb_ms {
        "~^0\.0{0,2}(?<ms>\d+)$" $ms;
        "~^(?<s>[1-9]\d*)\.(?<ms>\d{3})$" $s$ms;
        default null;
    }

    log_format json escape=json '{'
        '"source":"nginx",'
        '"time":"$time_iso8601",'
        '"host":"$host",'
        '"client_ip":"$http_cf_connecting_ip",'
        '"proxy_ip":"$http_x_real_ip",'
        '"method":"$request_method",'
        '"path":"$request_path",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"ttfb_ms":$ttfb_ms,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"app_route":"$upstream_http_x_app_route",'
        '"app_time":"$upstream_http_x_app_time",'
        '"current_user_type":"$upstream_http_x_current_user_type",'
        '"current_user_id":"$upstream_http_x_current_user_id"'
    '}';

    access_log /dev/stdout json if=$loggable;

    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;

    ##
    # Gzip Settings
    ##

    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Virtual Host Configs
    ##

    server {
        listen 80;
        server_name _;

        #
        # XSS protection
        #
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Response-Time $request_time always;

        #
        # Block attacks and useless requests
        #

        # Wordpress pingback DDoS
        if ($http_user_agent ~* "WordPress") {
            return 404;
        }

        # Wordpress automated attacks
        location ~* (wp\-includes|wp\-content|wp\-login|wp\-admin|wlwmanifest) {
            return 404;
        }

        # ACME
        location ~* /acme-challenge {
            return 404;
        }

        # Env files
        location ~* /\.env {
            return 404;
        }

        #
        # Application
        #
        root /app/public;
        index index.php;

        location ~* \.(eot|otf|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
            add_header X-Response-Time $request_time always;
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php(/|$) {
            internal;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;

            # Hide APM headers
            fastcgi_hide_header X-App-Route;
            fastcgi_hide_header X-App-Time;
            fastcgi_hide_header X-Current-User-Type;
            fastcgi_hide_header X-Current-User-Id;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
